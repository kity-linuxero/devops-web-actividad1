<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sitio web del Grupo 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="bg-primary text-white text-center py-5 mb-4">
    <h1>Sitio web del Grupo 1</h1>
  </header>

  <main class="container">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h3 class="card-title">¡Bienvenidos!</h3>
        <p class="card-text">
          Este es el sitio de prueba para el curso <strong>DevOps, integración y agilidad continua</strong>.
          <br>
          Actividad práctica 1.
        </p>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title">Integrantes</h4>
        <ul id="lista-integrantes" class="list-group list-group-flush">
          <!-- Aquí se insertarán dinámicamente los nombres -->
        </ul>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3 mt-4">
    &copy; 2025 Grupo 1 - DevOps Course
  </footer>

  <script>
    // Obtener los participantes desde la API y agregarlos al HTML
    fetch('/api/participantes')
      .then(response => response.json())
      .then(data => {
        const lista = document.getElementById('lista-integrantes');
        lista.innerHTML = data.map(p => `<li class="list-group-item">${p.nombre}</li>`).join('');
      })
      .catch(error => console.error('Error al obtener los participantes:', error));
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
