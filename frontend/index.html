<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio web del Grupo 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center">Sitio web del Grupo 1</h1>
    <p class="text-center">Este es el sitio de prueba para el curso DevOps, integración y agilidad continua. Actividad práctica 1.</p>

    <h2 class="mt-4">Integrantes</h2>
    <ul id="lista-integrantes" class="list-group"></ul>

    <script>
        // Obtener los participantes desde la API y agregarlos al HTML
        fetch('/api/participantes')
            .then(response => response.json())
            .then(data => {
                const lista = document.getElementById('lista-integrantes');
                lista.innerHTML = data.map(p => `<li class="list-group-item">${p.nombre}</li>`).join('');
            })
            .catch(error => console.error('Error al obtener los participantes:', error));
    </script>
</body>
</html>
